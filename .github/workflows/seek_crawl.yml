name: Python Package

on:
  workflow_dispatch:
    inputs:
      confirm_external_access:
        description: "Run external collection or write to the configured test spreadsheet"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release-build:
    if: ${{ inputs.confirm_external_access == true }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Google Chrome
        run: |
          set -ex
          sudo apt-get update -y
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb
          sudo apt-get install -y -f

      - name: Kill leftover Chrome processes
        run: |
          sudo pkill -9 chrome || true
          sudo pkill -9 chromedriver || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code
        run: |
          python scripts/seek.py
